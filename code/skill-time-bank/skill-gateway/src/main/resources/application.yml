server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  upload-dir: D:/Dev/workspace/Pwrokspace/Claude code/prometheus-skill-time-bank/code/skill-time-bank/uploads

spring:
  application:
    name: skill-time-bank
  datasource:
    url: jdbc:mysql://localhost:3306/prometheus_skill_bank?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
