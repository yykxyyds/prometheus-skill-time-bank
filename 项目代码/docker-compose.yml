version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: prometheus-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: prometheus_skill_bank
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prometheus-net

  backend:
    build: ./skill-time-bank
    container_name: prometheus-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/prometheus_skill_bank?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - prometheus-net

  frontend-user:
    build: ./skill-time-bank-web
    container_name: prometheus-frontend-user
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - prometheus-net

  frontend-admin:
    build: ./skill-admin-web
    container_name: prometheus-frontend-admin
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - prometheus-net

networks:
  prometheus-net:
    driver: bridge

volumes:
  mysql-data:
  uploads:
